# Every push and pull request: the pinned copy of the decompilation's files is intact, and the
# port plays every script in decomp/play/ as the original does, on Linux, macOS and Windows.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: decomp/ matches its MANIFEST
        run: tools/sync-decomp.sh --verify

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'Linux' && 'wasm32-unknown-unknown' || '' }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint the web build
        if: runner.os == 'Linux'
        run: cargo clippy -p mystery-house-app --target wasm32-unknown-unknown -- -D warnings

      - name: Every script in decomp/play/ gives the expected transcript and pixel hashes
        run: cargo test
