# Builds the game for macOS (one app for Apple silicon and Intel), Windows, Linux and web pages
# (a static folder for any web server), and puts the web build on the project's GitHub Pages
# site (https://kdylanhayes.github.io/mystery-house-port/). Pushing a
# tag v* publishes them as a GitHub release and deploys the site; running the workflow by hand
# builds and collects them without publishing (the packages are kept as the run's artifacts), and
# deploys the site only when asked (the pages input).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pages:
        description: Deploy this build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: The scripts pass on this system before anything is packaged
        run: cargo test --release

      - name: The version (the tag, or the commit for a trial run)
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF#refs/tags/}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "package=mystery-house-$v-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          cargo build --release -p mystery-house-app --target aarch64-apple-darwin
          cargo build --release -p mystery-house-app --target x86_64-apple-darwin
          app="dist/Mystery House.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/mystery-house" \
            target/aarch64-apple-darwin/release/mystery-house \
            target/x86_64-apple-darwin/release/mystery-house
          sed "s/@VERSION@/${VERSION#v}/" tools/Info.plist > "$app/Contents/Info.plist"
          cp README.md LICENSE dist/
          (cd dist && ditto -c -k --keepParent "Mystery House.app" "../$PACKAGE.zip" && zip -q "../$PACKAGE.zip" README.md LICENSE)

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p mystery-house-app
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/mystery-house.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ steps.version.outputs.package }}.zip"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p mystery-house-app
          mkdir -p "dist/${{ steps.version.outputs.package }}"
          cp target/release/mystery-house README.md LICENSE "dist/${{ steps.version.outputs.package }}/"
          tar -C dist -czf "${{ steps.version.outputs.package }}.tar.gz" "${{ steps.version.outputs.package }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            mystery-house-*.zip
            mystery-house-*.tar.gz
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: wasm-bindgen-cli at the version in Cargo.lock
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: Package for web pages
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF#refs/tags/}"; else v="dev-${GITHUB_SHA::7}"; fi
          tools/build-web.sh "dist/mystery-house-web"
          cp README.md LICENSE dist/mystery-house-web/
          (cd dist && zip -qr "../mystery-house-$v-web.zip" mystery-house-web)

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: mystery-house-*-web.zip
          if-no-files-found: error

  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: The four packages
        run: ls -l packages && test "$(ls packages | wc -l)" -eq 4

      - name: The release, with the four packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
            --title "Mystery House $GITHUB_REF_NAME" --notes-file - <<'EOF'
          Mystery House (On-Line Systems, 1980; public domain since 1987), ported from the
          decompilation. Download the package for your system:

          - **macOS** (Apple silicon and Intel): unzip and open `Mystery House.app`. It is not
            signed, so the first time, Control-click it and choose Open (or run
            `xattr -dr com.apple.quarantine "Mystery House.app"`).
          - **Windows**: unzip and run `mystery-house.exe`. It is not signed, so SmartScreen may
            ask first: More info, then Run anyway.
          - **Linux** (x86-64, X11 or Wayland): untar and run `./mystery-house`.
          - **Web pages**: unzip and copy the `mystery-house-web` folder to your web server;
            the game plays at that folder's `index.html` (or embed it with an `<iframe>`).

          The README in each package lists the keys and options.
          EOF

  pages:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: package

      - name: The site is the web package's folder
        run: unzip -q package/*-web.zip -d package && mv package/mystery-house-web site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
