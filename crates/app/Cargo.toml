[package]
name = "mystery-house-app"
version = "1.1.1"
description = "Mystery House in a window: the engine with the Apple II screen, keyboard and saves"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mystery-house"
path = "src/main.rs"

[dependencies]
mystery-house = { path = "../engine" }
pixels = "0.17.2"
winit = "0.30.13"
# std's Instant natively, the browser's clock in WebAssembly (where std's panics)
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Storage", "Location", "console"] }
